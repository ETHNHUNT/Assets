<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Higgsfield Prompt Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Cg fill='%237c8cff'%3E%3Crect x='6' y='6' width='8' height='8' rx='2'/%3E%3Crect x='18' y='9' width='8' height='8' rx='2' opacity='.7'/%3E%3Crect x='8' y='18' width='8' height='8' rx='2' opacity='.45'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080c; --panel:rgba(17,20,28,.86); --line:#242a36; --ink:#e9ecf4;
  --mut:#98a1b3; --acc:#7c8cff; --acc2:#54e0c0; --warn:#ffb454;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;touch-action:none}
button,input,select{font:inherit;color:inherit}

/* ---------- loader ---------- */
#load{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;
  transition:opacity .6s ease}
#load.gone{opacity:0;pointer-events:none}
.lwrap{width:min(420px,80vw);text-align:center}
.ltitle{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.lbar{height:2px;background:#1b2029;border-radius:2px;margin:18px 0 10px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .3s ease}
.lmsg{font-size:11.5px;color:var(--mut);min-height:1.4em}

/* ---------- chrome ---------- */
.hud{position:fixed;z-index:20}
#top{top:0;left:0;right:0;padding:14px 16px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(180deg,rgba(7,8,12,.92),rgba(7,8,12,0));pointer-events:none}
#top > *{pointer-events:auto}
h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
h1 span{color:var(--mut);font-weight:400}
#q{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;outline:none;backdrop-filter:blur(10px)}
#q:focus{border-color:var(--acc)}
#count{color:var(--mut);font-size:11.5px;white-space:nowrap}
.tgl{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;
  font-size:10.5px;color:var(--acc2);cursor:pointer;white-space:nowrap;backdrop-filter:blur(10px)}
.tgl.off{color:#6a7288}
.tgl:hover{border-color:var(--acc)}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);
  border:1px solid #2a4a45;background:rgba(30,60,55,.4);border-radius:20px;padding:3px 9px;white-space:nowrap}

#left{left:16px;top:64px;width:212px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  backdrop-filter:blur(12px)}
.lab{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.modes button{background:#141822;border:1px solid var(--line);border-radius:7px;padding:7px 4px;
  font-size:11px;cursor:pointer;color:var(--mut);transition:.16s}

.modes button:hover{color:var(--ink);border-color:#39415a}
.modes button.on{background:rgba(124,140,255,.16);border-color:var(--acc);color:#cdd4ff}
select{width:100%;background:#141822;border:1px solid var(--line);border-radius:7px;padding:7px 8px;
  font-size:11.5px;outline:none;margin-bottom:6px}
select:focus{border-color:var(--acc)}
#reset{width:100%;background:none;border:1px solid var(--line);border-radius:7px;padding:6px;
  font-size:11px;color:var(--mut);cursor:pointer}
#reset:hover{color:var(--ink);border-color:#39415a}

/* ---------- detail ---------- */
#detail{position:fixed;z-index:30;right:0;top:0;bottom:0;width:min(400px,92vw);
  background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(16px);
  transform:translateX(101%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column}
#detail.open{transform:none}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead h2{margin:0;font-size:14px;font-weight:650;flex:1;line-height:1.35}
#dcompare .cmp{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:10px}
#dcompare .cmp:last-child{border-bottom:0}
#dcompare .cmp img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none}
#dcompare .cmp .cm{font-size:11px;color:var(--dim);margin-bottom:4px}
#dcompare .cmp .cp{font-size:12px;line-height:1.45;white-space:pre-wrap;
  max-height:9.5em;overflow:auto}
#dcompare .cmp .cx{background:none;border:0;color:var(--dim);cursor:pointer;
  font-size:15px;padding:0 4px;align-self:flex-start}
#dcompare .cmp .cx:hover{color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.dnav{display:flex;align-items:center;gap:2px}
.dnav button{background:none;border:0;color:var(--dim);font-size:19px;line-height:1;
  padding:1px 7px;cursor:pointer;border-radius:6px}
.dnav button:hover:not(:disabled){background:rgba(124,140,255,.16);color:var(--fg)}
.dnav button:disabled{opacity:.28;cursor:default}
.dpos{font-size:11px;color:var(--dim);min-width:58px;text-align:center;
  font-variant-numeric:tabular-nums}
#dtags .t{cursor:pointer}
#dtags .t:hover{background:rgba(124,140,255,.22)}
#dclose{background:none;border:1px solid var(--line);border-radius:7px;width:26px;height:26px;
  cursor:pointer;color:var(--mut);flex:none;line-height:1}
#dclose:hover{color:var(--ink)}
.dbody{overflow:auto;padding:14px 16px 20px;flex:1}
#dimg{width:100%;border-radius:9px;display:block;background:#0d1016;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.t{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.t.m{color:var(--acc);border-color:#39406b}
.prompt{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;color:#c9cfdf;
  background:#0e1119;border:1px solid var(--line);border-radius:9px;padding:11px;max-height:38vh;overflow:auto}
.drow{display:flex;gap:8px;align-items:center;margin:12px 0 6px;flex-wrap:wrap}
.drow button{background:#141822;border:1px solid var(--line);border-radius:7px;padding:6px 11px;
  font-size:11.5px;cursor:pointer;color:var(--mut)}
.drow button:hover{color:var(--ink);border-color:var(--acc)}
.drow button.ok{color:var(--acc2);border-color:#2f6b5c}
a.src{font-size:11px;color:#6f79a0;text-decoration:none;word-break:break-all;display:block;margin-top:10px}
a.src:hover{color:var(--acc)}
.rid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#5f6880}

/* ---------- tooltip + footer ---------- */
#tip{position:fixed;z-index:25;pointer-events:none;background:rgba(10,12,18,.95);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:290px;font-size:11.5px;
  opacity:0;transition:opacity .12s;line-height:1.4}
#tip.on{opacity:1}
#tip b{display:block;font-size:12px;margin-bottom:2px}
#tip i{color:var(--mut);font-style:normal;font-size:10.5px}
#foot{left:16px;bottom:14px;color:#59617a;font-size:10.5px;line-height:1.7}
#foot .hint-phys{display:none} #foot.phys .hint-phys{display:inline} #foot.phys .hint-default{display:none}
kbd{background:#141822;border:1px solid var(--line);border-radius:4px;padding:0 4px;font:inherit;
  font-size:10px;color:var(--mut)}
#empty{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  color:var(--mut);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#empty.on{opacity:1}

/* ---------- touch / small screens ---------- */
@media (max-width:820px), (max-height:520px){
  /* Every control here is sized to 44px, the smallest target a finger hits
     reliably. The desktop sizes are 26-35px, which a mouse manages and a
     thumb does not. */
  #foot{display:none} #count{display:none} h1{display:none}
  #top{gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 12px}
  /* without min-width:0 a flex item refuses to shrink past its content, which
     is what pushed the bloom toggle and the backend badge off the screen */
  #q{min-width:0;flex:1 1 0;min-height:44px}
  .tgl{min-height:40px;padding:0 13px;display:inline-flex;align-items:center;font-size:11.5px}

  /* The rail becomes two scrolling rows along the bottom. One row could not
     hold six arrangements and four filters at a legible size, and folding the
     filters off-screen to the right hid that they exist at all. */
  #left{left:0;right:0;top:auto;bottom:0;width:auto;gap:6px;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(7,8,12,.94) 55%,rgba(7,8,12,0))}
  #left .card{background:none;border:0;backdrop-filter:none;border-radius:0;
    display:flex;gap:6px;align-items:center;padding:0 10px;
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;scrollbar-width:none}
  #left .card::-webkit-scrollbar{display:none}
  #left .lab{display:none}
  .modes{display:flex;gap:6px;flex:none}   /* must not shrink, or the row cannot scroll */
  .modes button,select,#reset{min-height:44px;flex:none;scroll-snap-align:start;
    white-space:nowrap;margin:0;width:auto}
  .modes button{padding:0 14px;font-size:12px}
  select{min-width:132px;padding:0 8px}
  #reset{padding:0 16px}

  #detail{width:100%}
  .dhead{padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
  #dclose{width:44px;height:44px;font-size:20px}
  .dbody{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .drow button{min-height:44px;padding:0 14px}
  /* kill the 300ms tap delay and double-tap zoom on the chrome */
  button,select,input{touch-action:manipulation}
}
/* a finger has no hover, so the tooltip is dead weight and the lift it
   implies never arrives — hide it rather than leave one stuck on screen */
@media (hover:none){ #tip{display:none} }
</style>
</head>
<body>

<div id="load"><div class="lwrap">
  <div class="ltitle">Higgsfield Prompt Atlas</div>
  <div class="lbar"><i id="lbar"></i></div>
  <div class="lmsg" id="lmsg">starting…</div>
</div></div>

<div class="hud" id="top">
  <h1>Prompt Atlas <span id="sub">· 2,619 generations</span></h1>
  <input id="q" type="search" aria-label="Search prompts" placeholder="Search 2.29M characters of prompt text…" autocomplete="off">
  <span id="count"></span>
  <button class="tgl off" id="sound" title="Sound off" aria-pressed="false">◍ sound</button>
  <button class="tgl" id="bloom" title="Bloom on" aria-pressed="true">✦ bloom</button>
  <a class="tgl" href="prompts/index.html" title="Every prompt as plain text">text</a>
  <span class="badge" id="backend">detecting</span>
</div>

<div class="hud" id="left">
  <div class="card">
    <div class="lab">Arrangement</div>
    <div class="modes" id="modes"></div>
  </div>
  <div class="card">
    <div class="lab">Filter</div>
    <select id="f-tool"><option value="">All tool types</option></select>
    <select id="f-model"><option value="">All models</option></select>
    <select id="f-style"><option value="">All styles</option></select>
    <select id="f-kind"><option value="">Image and video</option><option value="video">Video only</option><option value="image">Image only</option></select>
    <select id="f-sort" title="Order tiles are laid out in">
      <option value="">Order: tool, then model</option>
      <option value="length">Order: prompt length</option>
      <option value="model">Order: model</option>
      <option value="tool">Order: tool type</option>
    </select>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="hud" id="foot">
  <span class="hint-default"><kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom &nbsp;
  <kbd>click</kbd> inspect &nbsp; <kbd>i</kbd> inside &nbsp; <kbd>/</kbd> search &nbsp; <kbd>esc</kbd> close</span>
  <span class="hint-phys"><kbd>drag</kbd> orbit &nbsp; <kbd>click a tile</kbd> inspect &nbsp;
  <kbd>click empty space</kbd> shove the pile</span><br>
  <span id="fps"></span>
</div>

<div id="empty">Nothing matches these filters.</div>
<div id="tip"></div>

<p id="say" class="sr" aria-live="polite" role="status"></p>
<noscript>
  <p style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;
            padding:24px;z-index:99">
    The atlas needs WebGL. Every prompt is also published as
    <a href="prompts/index.html">plain text</a>.
  </p>
</noscript>
<aside id="detail">
  <div class="dhead">
    <h2 id="dname"></h2>
    <span class="dnav">
      <button id="dprev" aria-label="Previous match" title="Previous match (&larr;)">&lsaquo;</button>
      <span id="dpos" class="dpos"></span>
      <button id="dnext" aria-label="Next match" title="Next match (&rarr;)">&rsaquo;</button>
    </span>
    <button id="dclose" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dcompare" hidden></div>
  <div class="dbody" id="dsingle">
    <img id="dimg" alt="">
    <div class="tags" id="dtags"></div>
    <div class="prompt" id="dprompt"></div>
    <div class="drow">
      <button id="dcopy">Copy prompt</button>
      <button id="dsimilar">Show similar</button>
    </div>
    <div class="drow"><span class="rid" id="drid"></span></div>
    <a class="src" id="dsrc" target="_blank" rel="noopener"></a>
    <a class="src" id="dfull" target="_blank" rel="noopener"></a>
  </div>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/tsl/display/BloomNode.js": "./vendor/tsl/BloomNode.js",
    "animejs": "./vendor/anime.esm.min.js"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
