<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Higgsfield Prompt Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Cg fill='%237c8cff'%3E%3Crect x='6' y='6' width='8' height='8' rx='2'/%3E%3Crect x='18' y='9' width='8' height='8' rx='2' opacity='.7'/%3E%3Crect x='8' y='18' width='8' height='8' rx='2' opacity='.45'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens ---
   Eleven font sizes and seven corner radii had accumulated, which is what makes
   an interface look assembled rather than designed. These are the whole set;
   nothing below uses a value that is not named here.

   One accent, not two. Indigo carries every interactive state; the teal is spent
   only on "this is on" — a toggle lit, a prompt copied — so it still means
   something when it appears. */
:root{
  --bg:#07080c;
  --s1:#0d1017;        /* raised: inputs, buttons at rest */
  --s2:#12161f;        /* panels */
  --s3:#1a202c;        /* hover */
  --line:#1e2431;      /* hairline, used sparingly */
  --ink:#e9ecf4;
  --mut:#8f98ac;
  --faint:#5b6478;
  --acc:#7c8cff;
  --acc-soft:rgba(124,140,255,.14);
  --on:#54e0c0;        /* reserved: on-states and confirmations */

  --t1:19px; --t2:15px; --t3:13px; --t4:12px; --t5:11px;
  --r1:6px; --r2:10px; --r3:14px; --rp:999px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:var(--t3)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas{display:block;position:fixed;inset:0;touch-action:none}
button,input,select{font:inherit;color:inherit}
/* Keyboard focus is now how the atlas is navigated, so it has to be visible —
   and only for the keyboard, or every click leaves a ring behind. */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
:focus:not(:focus-visible){outline:none}
canvas:focus-visible{outline-offset:-3px}

/* ---------------------------------------------------------------- loader ---*/
#load{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;
  transition:opacity .6s ease}
#load.gone{opacity:0;pointer-events:none}
.lwrap{width:min(420px,80vw);text-align:center}
.ltitle{font-size:var(--t5);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.lbar{height:2px;background:var(--s2);border-radius:var(--rp);margin:var(--sp4) 0 var(--sp3);
  overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s ease}
.lmsg{font-size:var(--t5);color:var(--faint);min-height:1.4em}

/* ---------------------------------------------------------------- chrome ---*/
.hud{position:fixed;z-index:20}
#top{top:0;left:0;right:0;padding:var(--sp3) var(--sp4);display:flex;gap:var(--sp2);
  align-items:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,8,12,.94) 40%,rgba(7,8,12,0))}
#top > *{pointer-events:auto}
h1{margin:0;font-size:var(--t3);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:var(--faint);font-weight:400}
#q{flex:1;max-width:400px;background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r2);padding:var(--sp2) var(--sp3);outline:none;transition:border-color .15s}
#q::placeholder{color:var(--faint)}
#q:hover{border-color:var(--s3)}
#q:focus{border-color:var(--acc)}
#count{color:var(--mut);font-size:var(--t5);white-space:nowrap;font-variant-numeric:tabular-nums}
.tgl{background:var(--s1);border:1px solid var(--line);border-radius:var(--rp);
  padding:var(--sp1) var(--sp3);font-size:var(--t5);color:var(--on);cursor:pointer;
  white-space:nowrap;text-decoration:none;transition:.15s;display:inline-flex;align-items:center}
.tgl.off{color:var(--faint)}
.tgl:hover{background:var(--s3);border-color:var(--s3)}
.badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--on);
  border-radius:var(--rp);padding:var(--sp1) var(--sp2);white-space:nowrap;
  background:rgba(84,224,192,.1)}

/* ------------------------------------------------------------------ rail ---*/
#left{left:var(--sp4);top:60px;width:206px;display:flex;flex-direction:column;gap:var(--sp2)}
.card{background:var(--s2);border-radius:var(--r3);padding:var(--sp3);box-shadow:var(--shadow)}
.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin-bottom:var(--sp2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp1)}
.modes button{background:var(--s1);border:0;border-radius:var(--r1);padding:var(--sp2) var(--sp1);
  font-size:var(--t5);cursor:pointer;color:var(--mut);transition:.15s}
.modes button:hover{background:var(--s3);color:var(--ink)}
.modes button.on{background:var(--acc-soft);color:var(--acc);font-weight:550}
/* Native selects look like whatever the OS decided in 2011. */
select{width:100%;background:var(--s1);border:1px solid transparent;border-radius:var(--r1);
  padding:var(--sp2) 26px var(--sp2) var(--sp2);font-size:var(--t5);color:var(--mut);
  outline:none;margin-bottom:var(--sp1);cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238f98ac' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;transition:.15s}
select:hover{background-color:var(--s3);color:var(--ink)}
select:focus{border-color:var(--acc)}
#reset{width:100%;background:none;border:0;border-radius:var(--r1);padding:var(--sp2);
  font-size:var(--t5);color:var(--faint);cursor:pointer;transition:.15s;margin-top:var(--sp1)}
#reset:hover{background:var(--s1);color:var(--ink)}

/* ---------------------------------------------------------------- detail ---*/
/* A floating card inset from the edges rather than a panel welded to the side. The
   asset stays the subject; the information sits beside it as an object you could
   dismiss, which is the whole difference between a reader and an inspector. */
#detail{position:fixed;z-index:30;right:var(--sp3);top:var(--sp3);bottom:var(--sp3);
  width:min(392px,92vw);background:var(--s2);border-radius:var(--r3);
  box-shadow:0 18px 60px rgba(0,0,0,.62);
  transform:translateX(calc(100% + var(--sp4)));
  transition:transform .38s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden}
#detail.open{transform:none}
.dhead{padding:var(--sp3) var(--sp3) var(--sp3) var(--sp4);display:flex;
  gap:var(--sp2);align-items:flex-start}
.dtitle{flex:1;min-width:0}
.dhead h2{margin:0;font-size:var(--t3);font-weight:600;line-height:1.3;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dsub{margin:2px 0 0;font-size:var(--t5);color:var(--faint);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ---- sections: a small uppercase label, and the action that belongs to it ---- */
.sec{margin-top:var(--sp4)}
.sechead{display:flex;align-items:center;justify-content:space-between;width:100%;
  margin-bottom:var(--sp2);background:none;border:0;padding:0;text-align:left}
.sechead.as-button{cursor:pointer}
.seclab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  font-weight:600}
.chev{color:var(--faint);font-size:var(--t3);transition:transform .2s;
  transform:rotate(90deg);display:inline-block}
.sec.closed .chev{transform:rotate(0deg)}
.sec.closed .details{display:none}
.ghost{background:var(--s1);border:0;border-radius:var(--r1);color:var(--mut);
  font-size:var(--t5);padding:var(--sp1) var(--sp2);cursor:pointer;transition:.15s}
.ghost:hover{background:var(--s3);color:var(--ink)}
.ghost.ok{color:var(--on);background:rgba(84,224,192,.12)}

/* ---- details: label left, value right, the way a spec sheet reads ---- */
.details{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--sp2) var(--sp3);
  font-size:var(--t5)}
.details dt{color:var(--faint)}
.details dd{margin:0;color:var(--ink);text-align:right;overflow-wrap:anywhere}

/* A prompt that names its references should show them. 222 of these carry an @token
   or a <<<slot>>>, and they are the part a reader is looking for. */
.prompt mark{background:rgba(84,224,192,.14);color:var(--on);border-radius:3px;
  padding:0 3px}
.dnav{display:flex;align-items:center;gap:1px}
.dnav button{background:none;border:0;color:var(--mut);font-size:var(--t1);line-height:1;
  padding:1px var(--sp2);cursor:pointer;border-radius:var(--r1);transition:.15s}
.dnav button:hover:not(:disabled){background:var(--acc-soft);color:var(--acc)}
.dnav button:disabled{opacity:.25;cursor:default}
.dpos{font-size:var(--t5);color:var(--faint);min-width:58px;text-align:center;
  font-variant-numeric:tabular-nums}
#dclose{background:none;border:0;border-radius:var(--r1);width:28px;height:28px;
  cursor:pointer;color:var(--mut);flex:none;line-height:1;font-size:var(--t2);transition:.15s}
#dclose:hover{background:var(--s3);color:var(--ink)}
.dbody{overflow:auto;padding:var(--sp3) var(--sp4) var(--sp5);flex:1}
#dimg{width:100%;border-radius:var(--r2);display:block;background:var(--s1);
  margin-bottom:var(--sp3)}
.tags{display:flex;flex-wrap:wrap;gap:var(--sp1);margin-bottom:var(--sp3)}
.t{font-size:var(--t5);color:var(--mut);background:var(--s1);border-radius:var(--rp);
  padding:3px var(--sp2);transition:.15s}
.t.m{color:var(--acc);background:var(--acc-soft)}
#dtags .t[data-f]{cursor:pointer}
#dtags .t[data-f]:hover{background:var(--acc-soft);color:var(--acc)}
.prompt{white-space:pre-wrap;word-break:break-word;font-size:var(--t4);line-height:1.6;
  color:#cdd3e2;background:var(--s1);border-radius:var(--r2);padding:var(--sp3);
  max-height:38vh;overflow:auto}
.drow{display:flex;gap:var(--sp2);align-items:center;margin:var(--sp3) 0 var(--sp1);
  flex-wrap:wrap}
.drow button{background:var(--s1);border:0;border-radius:var(--r1);
  padding:var(--sp2) var(--sp3);font-size:var(--t5);cursor:pointer;color:var(--mut);
  transition:.15s}
.drow button:hover{background:var(--s3);color:var(--ink)}
.drow button.ok{color:var(--on);background:rgba(84,224,192,.12)}
a.src{font-size:var(--t5);color:var(--faint);text-decoration:none;word-break:break-all;
  display:block;margin-top:var(--sp2);transition:.15s}
a.src:hover{color:var(--acc)}
.rid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--faint)}

#dcompare .cmp{border-bottom:1px solid var(--line);padding:var(--sp3) 0;display:flex;
  gap:var(--sp3)}
#dcompare .cmp:last-child{border-bottom:0}
#dcompare .cmp img{width:60px;height:60px;object-fit:cover;border-radius:var(--r1);flex:none;
  background:var(--s1)}
#dcompare .cmp .cm{font-size:var(--t5);color:var(--faint);margin-bottom:var(--sp1)}
#dcompare .cmp .cp{font-size:var(--t4);line-height:1.5;white-space:pre-wrap;
  max-height:9.5em;overflow:auto;color:#cdd3e2}
#dcompare .cmp .cx{background:none;border:0;color:var(--faint);cursor:pointer;
  font-size:var(--t2);padding:0 var(--sp1);align-self:flex-start;border-radius:var(--r1)}
#dcompare .cmp .cx:hover{color:var(--ink)}

/* --------------------------------------------------------- tip and footer ---*/
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
#tip{position:fixed;z-index:25;pointer-events:none;background:var(--s2);
  border-radius:var(--r2);padding:var(--sp2) var(--sp3);max-width:290px;font-size:var(--t5);
  opacity:0;transition:opacity .12s;line-height:1.45;box-shadow:var(--shadow)}
#tip.on{opacity:1}
#tip b{display:block;font-size:var(--t4);margin-bottom:2px;font-weight:600}
#tip i{color:var(--mut);font-style:normal;font-size:var(--t5)}
/* The hints sit over whatever tile happens to be behind them, which at the bottom of
   a wall of thumbnails is usually something pale. A scrim rather than a panel: the
   text should stay incidental, and a bordered box down here would read as a control. */
#foot{left:0;right:0;bottom:0;padding:var(--sp5) var(--sp4) var(--sp3);color:var(--mut);
  font-size:var(--t5);line-height:1.9;pointer-events:none;
  background:linear-gradient(0deg,rgba(7,8,12,.92) 35%,rgba(7,8,12,0))}
#foot kbd,#foot #fps{pointer-events:auto}
#fps{color:var(--faint);font-variant-numeric:tabular-nums}
#foot .hint-phys{display:none} #foot.phys .hint-phys{display:inline} #foot.phys .hint-default{display:none}
kbd{background:var(--s1);border-radius:var(--r1);padding:1px 5px;font:inherit;
  font-size:10px;color:var(--mut)}
#empty{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--mut);font-size:var(--t3);opacity:0;transition:opacity .2s;
  pointer-events:none}
#empty.on{opacity:1}

/* ---------- touch / small screens ---------- */
@media (max-width:820px), (max-height:520px){
  /* Every control here is sized to 44px, the smallest target a finger hits
     reliably. The desktop sizes are 26-35px, which a mouse manages and a
     thumb does not. */
  #foot{display:none} #count{display:none} h1{display:none}
  #top{gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 12px}
  /* without min-width:0 a flex item refuses to shrink past its content, which
     is what pushed the bloom toggle and the backend badge off the screen */
  #q{min-width:0;flex:1 1 0;min-height:44px}
  .tgl{min-height:40px;padding:0 13px;display:inline-flex;align-items:center;font-size:var(--t5)}

  /* The rail becomes two scrolling rows along the bottom. One row could not
     hold six arrangements and four filters at a legible size, and folding the
     filters off-screen to the right hid that they exist at all. */
  #left{left:0;right:0;top:auto;bottom:0;width:auto;gap:6px;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(7,8,12,.94) 55%,rgba(7,8,12,0))}
  #left .card{background:none;border:0;backdrop-filter:none;border-radius:0;
    display:flex;gap:6px;align-items:center;padding:0 10px;
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;scrollbar-width:none}
  #left .card::-webkit-scrollbar{display:none}
  #left .lab{display:none}
  .modes{display:flex;gap:6px;flex:none}   /* must not shrink, or the row cannot scroll */
  .modes button,select,#reset{min-height:44px;flex:none;scroll-snap-align:start;
    white-space:nowrap;margin:0;width:auto}
  .modes button{padding:0 14px;font-size:var(--t4)}
  select{min-width:132px;padding:0 8px}
  #reset{padding:0 16px}

  #detail{width:100%}
  .dhead{padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
  #dclose{width:44px;height:44px;font-size:var(--t1)}
  .dbody{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .drow button{min-height:44px;padding:0 14px}
  /* kill the 300ms tap delay and double-tap zoom on the chrome */
  button,select,input{touch-action:manipulation}
}
/* a finger has no hover, so the tooltip is dead weight and the lift it
   implies never arrives — hide it rather than leave one stuck on screen */
@media (hover:none){ #tip{display:none} }
</style>
</head>
<body>

<div id="load"><div class="lwrap">
  <div class="ltitle">Higgsfield Prompt Atlas</div>
  <div class="lbar"><i id="lbar"></i></div>
  <div class="lmsg" id="lmsg">starting…</div>
</div></div>

<div class="hud" id="top">
  <h1>Prompt Atlas <span id="sub"></span></h1>
  <input id="q" type="search" aria-label="Search prompts" placeholder="Search 2.29M characters of prompt text…" autocomplete="off">
  <span id="count"></span>
  <button class="tgl off" id="sound" title="Sound off" aria-pressed="false">◍ sound</button>
  <button class="tgl" id="bloom" title="Bloom on" aria-pressed="true">✦ bloom</button>
  <a class="tgl" href="prompts/index.html" title="Every prompt as plain text">text</a>
  <span class="badge" id="backend">detecting</span>
</div>

<div class="hud" id="left">
  <div class="card">
    <div class="lab">Arrangement</div>
    <div class="modes" id="modes"></div>
  </div>
  <div class="card">
    <div class="lab">Filter</div>
    <select id="f-tool"><option value="">All tool types</option></select>
    <select id="f-model"><option value="">All models</option></select>
    <select id="f-style"><option value="">All styles</option></select>
    <select id="f-kind"><option value="">Image and video</option><option value="video">Video only</option><option value="image">Image only</option></select>
    <select id="f-sort" title="Order tiles are laid out in">
      <option value="">Order: tool, then model</option>
      <option value="length">Order: prompt length</option>
      <option value="model">Order: model</option>
      <option value="tool">Order: tool type</option>
    </select>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="hud" id="foot">
  <span class="hint-default"><kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom &nbsp;
  <kbd>&larr;&rarr;</kbd> move &nbsp; <kbd>enter</kbd> open &nbsp; <kbd>shift-click</kbd> compare &nbsp;
  <kbd>/</kbd> search &nbsp; <kbd>esc</kbd> close</span>
  <span class="hint-phys"><kbd>drag</kbd> orbit &nbsp; <kbd>click a tile</kbd> inspect &nbsp;
  <kbd>click empty space</kbd> shove the pile</span><br>
  <span id="fps"></span>
</div>

<div id="empty">Nothing matches these filters.</div>
<div id="tip"></div>

<p id="say" class="sr" aria-live="polite" role="status"></p>
<noscript>
  <p style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;
            padding:24px;z-index:99">
    The atlas needs WebGL. Every prompt is also published as
    <a href="prompts/index.html">plain text</a>.
  </p>
</noscript>
<aside id="detail">
  <div class="dhead">
    <div class="dtitle">
      <h2 id="dname"></h2>
      <p id="dsub"></p>
    </div>
    <span class="dnav">
      <button id="dprev" aria-label="Previous match" title="Previous match (&larr;)">&lsaquo;</button>
      <span id="dpos" class="dpos"></span>
      <button id="dnext" aria-label="Next match" title="Next match (&rarr;)">&rsaquo;</button>
    </span>
    <button id="dclose" aria-label="Close">&times;</button>
  </div>

  <div class="dbody" id="dsingle">
    <img id="dimg" alt="">
    <div class="tags" id="dtags"></div>

    <section class="sec">
      <div class="sechead">
        <span class="seclab">Prompt</span>
        <button id="dcopy" class="ghost">Copy</button>
      </div>
      <div class="prompt" id="dprompt"></div>
    </section>

    <section class="sec">
      <button class="sechead as-button" id="dtoggle" aria-expanded="true" aria-controls="ddetails">
        <span class="seclab">Details</span><span class="chev">&rsaquo;</span>
      </button>
      <dl class="details" id="ddetails"></dl>
    </section>

    <div class="drow"><button id="dsimilar">Show similar</button></div>
    <a class="src" id="dsrc" target="_blank" rel="noopener"></a>
    <a class="src" id="dfull" target="_blank" rel="noopener"></a>
    <p class="rid" id="drid"></p>
  </div>

  <div class="dbody" id="dcompare" hidden></div>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/tsl/display/BloomNode.js": "./vendor/tsl/BloomNode.js",
    "animejs": "./vendor/anime.esm.min.js"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
